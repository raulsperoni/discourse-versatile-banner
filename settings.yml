show_for_members:
  type: bool
  default: true
show_for_anon:
  type: bool
  default: true
display_on_mobile:
  type: bool
  default: true
display_on_desktop:
  type: bool
  default: true
display_on_homepage:
  type: bool
  default: true
url_must_contain:
  type: list
  list_type: simple
  default: /latest|/categories|/new|/unread|/top*|/tag/*|/tags/*|/c/*|/t/*
dismissible:
  type: bool
  default: false
collapsible:
  type: bool
  default: false
default_collapsed_state:
  type: enum
  default: collapsed
  choices:
    - expanded
cookie_lifespan:
  type: enum
  default: none
  choices:
    - minute
    - day
    - week
    - month
    - year
enable_auto_carousel:
  type: bool
  default: false
  description: When enabled, the banner carousel will automatically move between slides
auto_carousel_speed:
  type: enum
  default: medium
  choices:
    - slow
    - medium
    - fast
  description: How quickly the carousel should automatically move between slides
auto_carousel_pause_on_hover:
  type: bool
  default: true
  description: Pause the auto-movement when the user hovers over the carousel
cookie_name:
  type: string
  default: "v1"
full_width_banner:
  type: bool
  default: false
swap_default_positioning:
  type: bool
  default: false
plugin_outlet:
  type: enum
  default: "below-site-header"
  choices:
    - "below-site-header"
    - "above-main-container"
  refresh: true
banner_1_enabled:
  type: bool
  default: true
  description: "Enable the first banner slide"
banner_1_background_color:
  type: string
  default: "#EED4A1"
  description: "Background color for the first banner"
banner_1_background_color_dark:
  type: string
  default: ""
  description: "Dark mode background color for the first banner"
banner_1_background_image:
  type: string
  default: ""
  description: "Background image URL for the first banner (optional)"
banner_1_background_image_dark:
  type: string
  default: ""
  description: "Dark mode background image URL for the first banner (optional)"
banner_1_content_image:
  type: string
  default: "des1"
  description: "Main content image for the first banner (use asset name from about.json)"
banner_1_content_image_alt:
  type: string
  default: "Banner 1 Image"
  description: "Alt text for the first banner image"

banner_2_enabled:
  type: bool
  default: false
  description: "Enable the second banner slide"
banner_2_background_color:
  type: string
  default: "#FF6C00"
  description: "Background color for the second banner"
banner_2_background_color_dark:
  type: string
  default: ""
  description: "Dark mode background color for the second banner"
banner_2_background_image:
  type: string
  default: ""
  description: "Background image URL for the second banner (optional)"
banner_2_background_image_dark:
  type: string
  default: ""
  description: "Dark mode background image URL for the second banner (optional)"
banner_2_content_image:
  type: string
  default: "des2"
  description: "Main content image for the second banner (use asset name from about.json)"
banner_2_content_image_alt:
  type: string
  default: "Banner 2 Image"
  description: "Alt text for the second banner image"

banner_3_enabled:
  type: bool
  default: false
  description: "Enable the third banner slide"
banner_3_background_color:
  type: string
  default: "#0f82af"
  description: "Background color for the third banner"
banner_3_background_color_dark:
  type: string
  default: ""
  description: "Dark mode background color for the third banner"
banner_3_background_image:
  type: string
  default: ""
  description: "Background image URL for the third banner (optional)"
banner_3_background_image_dark:
  type: string
  default: ""
  description: "Dark mode background image URL for the third banner (optional)"
banner_3_content_image:
  type: string
  default: "agenda"
  description: "Main content image for the third banner (use asset name from about.json)"
banner_3_content_image_alt:
  type: string
  default: "Banner 3 Image"
  description: "Alt text for the third banner image"

# All column-related settings removed since using carousel-only approach
