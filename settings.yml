show_for_members:
  type: bool
  default: true
show_for_anon:
  type: bool
  default: true
display_on_mobile:
  type: bool
  default: true
display_on_desktop:
  type: bool
  default: true
display_on_homepage:
  type: bool
  default: true
url_must_contain:
  type: list
  list_type: simple
  default: /latest|/categories|/new|/unread|/top*|/tag/*|/tags/*|/c/*|/t/*
dismissible:
  type: bool
  default: false
collapsible:
  type: bool
  default: false
default_collapsed_state:
  type: enum
  default: collapsed
  choices:
    - expanded
cookie_lifespan:
  type: enum
  default: none
  choices:
    - minute
    - day
    - week
    - month
    - year
enable_auto_carousel:
  type: bool
  default: false
  description: When enabled, the banner carousel will automatically move between slides
auto_carousel_speed:
  type: enum
  default: medium
  choices:
    - slow
    - medium
    - fast
  description: How quickly the carousel should automatically move between slides
auto_carousel_pause_on_hover:
  type: bool
  default: true
  description: Pause the auto-movement when the user hovers over the carousel
cookie_name:
  type: string
  default: "v1"
full_width_banner:
  type: bool
  default: false
swap_default_positioning:
  type: bool
  default: false
plugin_outlet:
  type: enum
  default: "below-site-header"
  choices:
    - "below-site-header"
    - "above-main-container"
  refresh: true
banner_1_enabled:
  type: bool
  default: true
  description: "Habilitar la primera diapositiva del banner"
banner_1_background_color:
  type: string
  default: "#EED4A1"
  description: "Color de fondo para el primer banner"
banner_1_background_color_dark:
  type: string
  default: ""
  description: "Color de fondo en modo oscuro para el primer banner"
banner_1_background_image:
  type: string
  default: ""
  description: "URL de imagen de fondo para el primer banner (opcional)"
banner_1_background_image_dark:
  type: string
  default: ""
  description: "URL de imagen de fondo en modo oscuro para el primer banner (opcional)"
banner_1_content_image:
  type: string
  default: "des1"
  description: "Imagen principal del contenido para el primer banner (usar nombre del asset de about.json)"
banner_1_content_image_alt:
  type: string
  default: "Banner 1 Image"
  description: "Texto alternativo para la imagen del primer banner"
banner_1_badge_text:
  type: string
  default: "PENSAR, DISENTIR, ACORDAR Y CONSTRUIR"
  description: "Texto de la etiqueta mostrada arriba de la pregunta para el primer banner"
banner_1_question_text:
  type: string
  textarea: true
  default: "¿Qué te hace sentir/pensar que tu participación en el Despacho 23 es valiosa?"
  description: "Texto de la pregunta principal para el primer banner"
banner_1_cta_text:
  type: string
  default: "¡Contanos tu opinión para mejorarla!"
  description: "Texto del botón de llamada a la acción para el primer banner"
banner_1_cta_link:
  type: string
  default: ""
  description: "Enlace del botón de llamada a la acción para el primer banner"
banner_1_cta_bg_color:
  type: string
  default: "#ec4899"
  description: "Color de fondo del botón de llamada a la acción para el primer banner"
banner_1_cta_text_color:
  type: string
  default: "#ffffff"
  description: "Color del texto del botón de llamada a la acción para el primer banner"

